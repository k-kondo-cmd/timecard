<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード生成 - 出退勤管理</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .generator-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            min-height: 200px;
        }

        #qrcode canvas,
        #qrcode img {
            border: 5px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        .qr-info {
            text-align: center;
            color: #666;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .qr-info p {
            margin: 5px 0;
        }

        .btn-download {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .btn-download:hover {
            transform: translateY(-2px);
        }

        .btn-download.show {
            display: block;
        }

        .sample-ids {
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .sample-ids h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .sample-ids p {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }

        .sample-id {
            display: inline-block;
            background: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sample-id:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRコード生成</h1>
        </header>

        <main>
            <section class="generator-section">
                <div class="input-group">
                    <label for="employeeId">従業員ID</label>
                    <input type="text" id="employeeId" placeholder="例: EMP001" autocomplete="off">
                </div>

                <button class="btn-generate" onclick="generateQRCode()">QRコードを生成</button>

                <div id="qrcode"></div>

                <button class="btn-download" id="downloadBtn" onclick="downloadQRCode()">QRコードをダウンロード</button>

                <div id="qrInfo" class="qr-info" style="display: none;">
                    <p><strong>生成されたID:</strong> <span id="generatedId"></span></p>
                    <p>このQRコードをスマートフォンで読み取ると出退勤が記録されます</p>
                </div>

                <div class="sample-ids">
                    <h3>サンプルID (クリックで入力)</h3>
                    <p>
                        <span class="sample-id" onclick="setEmployeeId('EMP001')">EMP001</span>
                        <span class="sample-id" onclick="setEmployeeId('EMP002')">EMP002</span>
                        <span class="sample-id" onclick="setEmployeeId('EMP003')">EMP003</span>
                        <span class="sample-id" onclick="setEmployeeId('STAFF001')">STAFF001</span>
                    </p>
                </div>
            </section>
        </main>

        <footer>
            <p><a href="index.html">出退勤記録画面に戻る</a></p>
        </footer>
    </div>

    <script>
        let currentQRCode = null;

        function generateQRCode() {
            const employeeId = document.getElementById('employeeId').value.trim();

            if (!employeeId) {
                alert('従業員IDを入力してください');
                return;
            }

            // 既存のQRコードをクリア
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';

            // QRコードを生成
            currentQRCode = new QRCode(qrcodeDiv, {
                text: employeeId,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // 情報を表示
            document.getElementById('generatedId').textContent = employeeId;
            document.getElementById('qrInfo').style.display = 'block';
            document.getElementById('downloadBtn').classList.add('show');
        }

        function downloadQRCode() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QRコードが生成されていません');
                return;
            }

            const employeeId = document.getElementById('employeeId').value.trim();
            const link = document.createElement('a');
            link.download = `qrcode_${employeeId}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function setEmployeeId(id) {
            document.getElementById('employeeId').value = id;
            generateQRCode();
        }

        // Enterキーでも生成できるようにする
        document.getElementById('employeeId').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateQRCode();
            }
        });
    </script>
</body>
</html>
